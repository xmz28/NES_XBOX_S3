name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Verify generated test ROM
        run: |
          python tools/make_test_rom.py
          git diff --exit-code -- assets/test.nes
      - name: Run packer tests
        run: python -m unittest discover -s tests -v
      - name: Build firmware and public test ROM
        run: pio run -j 1
